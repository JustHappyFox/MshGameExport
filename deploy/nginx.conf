# autoedit.ink — Mini App, API и выдача готовых файлов.
# Положить в /etc/nginx/sites-available/autoedit.ink и слинковать в sites-enabled.
# Сертификат: certbot --nginx -d autoedit.ink -d www.autoedit.ink

upstream autoedit_api {
    server 127.0.0.1:8081 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name autoedit.ink www.autoedit.ink;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://autoedit.ink$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.autoedit.ink;

    ssl_certificate     /etc/letsencrypt/live/autoedit.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autoedit.ink/privkey.pem;

    return 301 https://autoedit.ink$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name autoedit.ink;

    ssl_certificate     /etc/letsencrypt/live/autoedit.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autoedit.ink/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Mini App грузит видео целиком — лимит должен быть выше MAX_UPLOAD_BYTES.
    client_max_body_size 2g;
    client_body_timeout 600s;
    client_body_buffer_size 1m;
    send_timeout 600s;

    access_log /var/log/nginx/autoedit.access.log;
    error_log  /var/log/nginx/autoedit.error.log;

    # Telegram открывает Mini App во фрейме, поэтому X-Frame-Options не ставим.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /opt/autoedit/web;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location /static/ {
        alias /opt/autoedit/web/;
        expires 10m;
        add_header Cache-Control "public, max-age=600" always;
    }

    location /api/ {
        proxy_pass http://autoedit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # видео льётся на диск потоком
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Ссылка на скачивание: приложение проверяет подпись и отдаёт
    # X-Accel-Redirect, сами байты льёт nginx.
    location /d/ {
        proxy_pass http://autoedit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /_files/ {
        internal;
        alias /var/lib/autoedit/outputs/;
        add_header Cache-Control "private, no-store" always;
        add_header Accept-Ranges bytes always;
    }
}
